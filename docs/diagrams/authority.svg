<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" width="820" height="660" role="img" aria-labelledby="wf-auth-title wf-auth-desc">
  <title id="wf-auth-title">How the authority envelope governs an action</title>
  <desc id="wf-auth-desc">An action proposed is checked against the envelope. If the action type is forbidden it is refused, the reason is spoken, and action_refused is recorded. Otherwise, if the document was read with low confidence, the policy decides ask, refuse, or escalate. Otherwise, if the amount is above the auto-act limit, the user is asked to confirm; on confirmation the action is performed and action_confirmed is recorded. Actions within limits are performed and action_executed is recorded.</desc>
  <defs>
    <marker id="wf-arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a948a"/>
    </marker>
    <style>
      .a-box { fill: #ffffff; stroke: #c9c3b8; stroke-width: 1.5; }
      .a-term { fill: #e8f0ff; stroke: #1f5fd6; stroke-width: 1.5; }
      .a-dec { fill: #eef3ff; stroke: #1f5fd6; stroke-width: 1.5; }
      .a-alert { fill: #fdece9; stroke: #8a1f11; stroke-width: 1.5; }
      .a-ok { fill: #e6f5ec; stroke: #14653a; stroke-width: 1.5; }
      .a-t { fill: #17161a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; }
      .a-s { fill: #4a463f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .a-e { stroke: #9a948a; stroke-width: 1.6; fill: none; marker-end: url(#wf-arrow2); }
      .a-l { fill: #6b665e; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
      .a-d { fill: #1f5fd6; }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="818.5" height="658.5" rx="16" fill="#ffffff" stroke="#e4e0d8" stroke-width="1.5"/>

  <g>
    <rect class="a-term" x="50" y="30" width="290" height="64" rx="32"/>
    <text class="a-t" x="195" y="68" text-anchor="middle">Action proposed</text>
  </g>

  <g>
    <rect class="a-dec" x="50" y="130" width="290" height="64" rx="12"/>
    <polygon class="a-d" points="68,162 78,154 88,162 78,170"/>
    <text class="a-t" x="212" y="167" text-anchor="middle">Forbidden by you?</text>
  </g>
  <g>
    <rect class="a-alert" x="430" y="130" width="350" height="64" rx="12"/>
    <text class="a-s" x="605" y="158" text-anchor="middle">Refuse, speak the reason,</text>
    <text class="a-s" x="605" y="178" text-anchor="middle">record action_refused</text>
  </g>

  <g>
    <rect class="a-dec" x="50" y="230" width="290" height="64" rx="12"/>
    <polygon class="a-d" points="68,262 78,254 88,262 78,270"/>
    <text class="a-t" x="212" y="267" text-anchor="middle">Read with low confidence?</text>
  </g>
  <g>
    <rect class="a-box" x="430" y="230" width="350" height="64" rx="12"/>
    <text class="a-s" x="605" y="258" text-anchor="middle">Ask, refuse, or escalate,</text>
    <text class="a-s" x="605" y="278" text-anchor="middle">per your policy</text>
  </g>

  <g>
    <rect class="a-dec" x="50" y="330" width="290" height="64" rx="12"/>
    <polygon class="a-d" points="68,362 78,354 88,362 78,370"/>
    <text class="a-t" x="212" y="367" text-anchor="middle">Above your auto-act limit?</text>
  </g>
  <g>
    <rect class="a-box" x="430" y="330" width="350" height="64" rx="12"/>
    <text class="a-t" x="605" y="367" text-anchor="middle">Ask you to confirm</text>
  </g>

  <g>
    <rect class="a-box" x="50" y="430" width="290" height="64" rx="12"/>
    <text class="a-t" x="195" y="468" text-anchor="middle">Act</text>
  </g>
  <g>
    <rect class="a-ok" x="430" y="430" width="350" height="64" rx="12"/>
    <text class="a-t" x="605" y="468" text-anchor="middle">Act and record action_confirmed</text>
  </g>

  <g>
    <rect class="a-ok" x="50" y="530" width="290" height="64" rx="12"/>
    <text class="a-t" x="195" y="568" text-anchor="middle">Record action_executed</text>
  </g>

  <path class="a-e" d="M195 94 V130"/>
  <path class="a-e" d="M340 162 H430"/>
  <text class="a-l" x="376" y="153" text-anchor="middle">yes</text>
  <path class="a-e" d="M195 194 V230"/>
  <text class="a-l" x="209" y="216">no</text>

  <path class="a-e" d="M340 262 H430"/>
  <text class="a-l" x="376" y="253" text-anchor="middle">yes</text>
  <path class="a-e" d="M195 294 V330"/>
  <text class="a-l" x="209" y="316">no</text>

  <path class="a-e" d="M340 362 H430"/>
  <text class="a-l" x="376" y="353" text-anchor="middle">yes</text>
  <path class="a-e" d="M195 394 V430"/>
  <text class="a-l" x="209" y="416">no</text>

  <path class="a-e" d="M605 394 V430"/>
  <text class="a-l" x="617" y="416">you confirm</text>

  <path class="a-e" d="M195 494 V530"/>
  <path class="a-e" d="M605 494 V562 H340"/>
</svg>
